name: Android APK

on:
  push:
    branches: [main]
    paths: ['web/**', 'android/**', 'tools/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle the game
        run: python3 tools/build.py

      - uses: gradle/actions/setup-gradle@v4

      - name: Use the signing key from secrets when one is configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk CrosstownHeat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CrosstownHeat-apk
          path: CrosstownHeat.apk

      - name: Publish the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CrosstownHeat.apk \
            --title "Crosstown Heat (latest build)" \
            --notes "Automatic build of ${GITHUB_SHA::7}. On your Android phone, download CrosstownHeat.apk and open it to install." \
            --latest
